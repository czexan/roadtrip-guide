<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Terrain and places • design study</title><link rel="stylesheet" href="leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f5f1e7;color:#24382e}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap}button,select{font:inherit;padding:8px;border:1px solid #b8b7a9;border-radius:5px;background:white;min-height:38px}#map{height:calc(100vh - 102px);min-height:280px}.leaflet-control-layers-toggle{background-image:none!important;width:55px!important;display:grid;place-items:center}.leaflet-control-layers-toggle:after{content:"Layers"}.pin{border:2px solid white;border-radius:50%;background:#245e51;box-shadow:0 1px 5px #333;color:white;text-align:center;line-height:14px;font-size:12px}.leaflet-popup-content{width:220px!important;margin:12px}.preview img{width:100%;height:106px;object-fit:cover;border-radius:4px}.preview .missing{background:#eae5d9;padding:17px;text-align:center;color:#5d625c}.preview small{display:block;text-transform:uppercase;letter-spacing:.06em;margin:8px 0 4px}.preview h3{margin:0 0 6px;font-size:17px}.preview p{margin:5px 0;font-size:12px}.preview a{color:#255548}.foot{font-size:11px;margin:5px 10px}.leaflet-tooltip{font:12px system-ui;max-width:220px;white-space:normal}.leaflet-control-attribution{font-size:9px!important}#status{color:#a43f1b}.place-label{background:#fffef3e8;border:0;box-shadow:none;padding:1px 4px;font-weight:600;font-size:11px}.place-label:before{display:none}.leaflet-popup{z-index:999}

</style><header><button id="all">Whole trip</button><button id="mountains">Aspen ↔ Crested Butte</button><select id="place" aria-label="Find a place"><option value="">Find a place…</option></select></header><div id="map" aria-label="Interactive terrain map"></div><p class="foot">Hover or tap a marker. + / − to zoom. Markers locate places, not entrances. Terrain tiles need internet. <span id="status"></span></p><script src="leaflet.js"></script><script>
const places=[

['Breckenridge/Frisco area','Mountain towns and reservoir',39.5744,-106.0975,'frisco','Breckenridge, Frisco, Silverthorne and Dillon Reservoir form the first-stop area. Camp at Peak One Campground or check The Bivvi Hostel in Breckenridge.','https://www.townoffrisco.com/'],
['Peak One Campground','Campground',39.575,-106.07,'','Camping on the Frisco Peninsula beside Dillon Reservoir. Distinct from Peak One mountain. Approximate campground location.','https://www.recreation.gov/search?q=Peak%20One%20Campground'],
['Breckenridge','Mountain town',39.4817,-106.0384,'breck','Historic town, cafes, hostel option and mountain access.','https://gobreck.com/'],
['Leadville','Historic mountain town',39.2508,-106.2925,'discovery-leadville-saloon','Optional saloon and town stop; no overnight required.','https://www.leadvilletwinlakes.com/'],

['Maroon Bells Scenic Area','Scenic lake and hiking area',39.0989,-106.9406,'mountains','Maroon Lake views and hiking, separate from Aspen town.','https://www.aspensnowmass.com/visit/activities/summer/maroon-bells'],
['Crested Butte','Mountain town',38.8697,-106.9878,'cb-fall','Elk Avenue, autumn walks and mountain biking. The Elk Mountains separate it from Aspen.','https://gunnisoncrestedbutte.com/'],
["Big B’s Delicious Orchards",'Optional lunch stop · cider garden',38.863,-107.62,'','Lunch, cider and a break if passing near Paonia; camping is secondary. Approximate area marker; use venue directions for arrival.','https://www.bigbs.com/camping'],
['Telluride','Mountain town',37.9375,-107.8123,'telluride','Box-canyon town, hiking and via ferrata option.','https://www.telluride.com/'],
['Moab','Desert town',38.5733,-109.5498,'moab-town','Base for riding, river camps, Arches and canyon walks.','https://www.discovermoab.com/'],
['Corona Arch Trail','Hiking trail',38.5748,-109.6328,'moab','Railway crossing and sandstone arch, off Potash Road. Marker locates the arch, not trailhead.','https://www.blm.gov/visit/corona-arch-trail'],
['Torrey / Capitol Reef','Town and national park gateway',38.2997,-111.4205,'reef','Northern route: sandstone cliffs, Hickman Bridge and scenic UT-24. A short stop is enough if continuing toward Escalante.','https://www.nps.gov/care/'],
['Escalante','Desert town',37.7703,-111.6021,'','Northern route gateway to canyon country and scenic Highway 12.','https://www.blm.gov/visit/grand-staircase-escalante-national-monument'],

['Hoover Dam','Dam and engineering landmark',36.016,-114.7377,'discovery-hoover','Separate detour southeast of Las Vegas, not on the direct road from Zion.','https://www.usbr.gov/lc/hooverdam/service/directions.html'],
['Red Rock Canyon','National conservation area',36.135,-115.427,'','Optional outing west of Las Vegas. Scenic loop, hiking and climbing; check October timed-entry requirements.','https://www.blm.gov/visit/red-rock-canyon-national-conservation-area']];
const map=L.map('map',{scrollWheelZoom:false,zoomSnap:.25}).fitBounds([[35.7,-115.7],[40.25,-103.8]]);
const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:15,attribution:'Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, SRTM | © <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA</a>)'});
const road=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'});const usgs=L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'<a href="https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer">USGS The National Map and contributors</a>'});
const aerial=L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryTopo/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'<a href="https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryTopo/MapServer">USGS imagery / NAIP / Blue Marble and contributors</a>'});
const stamen=L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_terrain/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© <a href="https://stadiamaps.com/">Stadia Maps</a> © <a href="https://stamen.com/">Stamen Design</a> © <a href="https://openmaptiles.org/">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
const basemaps={topo,usgs,aerial,stamen,road};const requestedBase=new URLSearchParams(location.search).get('base')||'usgs';(basemaps[requestedBase]||topo).addTo(map);
L.control.layers({'USGS Topo':usgs,'USGS aerial + labels':aerial,'OpenTopoMap':topo,'Street map':road,...(['localhost','127.0.0.1'].includes(location.hostname)?{'Stamen Terrain · local preview':stamen}:{})},null,{collapsed:true}).addTo(map);L.control.scale({imperial:true}).addTo(map);
topo.on('tileerror',()=>document.querySelector('#status').textContent='Some terrain tiles unavailable; try Street map in layers.');
function visitDate(i){const c=new URLSearchParams(location.search).get('co')||new URLSearchParams(location.search).get('choice');if(i===20)return 'Sep 24–26 Moab option';if(i>20)return 'Optional Oct 2; no extra overnight';if(i===0)return 'Sep 19 arrival';if([1,2,3].includes(i))return 'Sep 19 night';if(i===4)return 'Sep 20 passing stop';if([5,6].includes(i))return c==='cb'?'Not in Crested Butte-only choice':c==='both'?'Sep 20; depart Sep 21':'Sep 20–21 if choosing Aspen';if(i===7)return c==='aspen'?'Not in Aspen-only choice':c==='both'?'Sep 21; depart Sep 22':'Sep 20–21 if choosing Crested Butte';if(i===8)return 'Optional stop if passing';if(i===9)return 'Sep 22–23 nights; depart Sep 24';if([10,11].includes(i))return 'Sep 24–26 nights in Moab';if(i===14&&new URLSearchParams(location.search).get('bryce')==='1')return 'Optional Sep 30 day trip; or overnight Sep 28';if([12,13,14].includes(i))return 'Sep 27–28 northern route';if(i===15)return 'Sep 27 southern route';if(i===16)return 'Sep 27–28; Antelope tour target Sep 28';if(i===17)return 'Optional Sep 28–29; reduces Zion time';if(i===18)return 'Sep 29–Oct 1 nights';return 'Oct 2 night; Oct 3 departure';}
function showHover(html){let box=document.getElementById('hover-preview');if(!box){box=document.createElement('aside');box.id='hover-preview';box.setAttribute('aria-label','Place preview');document.getElementById('map').append(box);L.DomEvent.disableClickPropagation(box);L.DomEvent.disableScrollPropagation(box);}box.innerHTML='<button aria-label="Close place preview" onclick="this.parentElement.remove()">×</button>'+html;}
const markers=places.map((p,i)=>{let icon=p[1].includes('Campground')?'⌂':p[1].includes('trail')?'↟':p[1].includes('Airport')?'✈':'•';const html=`<div class="preview">${p[4]?`<img src="../assets/${p[4]}.jpg" alt="${p[0]}">`:''}<small>${p[1]}</small><h3>${p[0]}</h3><p><b>Tentative: ${visitDate(i)}</b></p><p>${p[5]}</p><a href="${p[6]}" target="_blank" rel="noopener">Place details ↗</a> · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p[0])}" target="_blank" rel="noopener">Google Maps ↗</a>${p[4]?'<p>Photo credit: <a href="../index.html#credits" target="_blank">guide credits</a> (<a href="a.html#photo-credits" target="_blank">additional gallery and town credits</a>)</p>':''}</div>`;const m=L.marker([p[2],p[3]],{opacity:p[0].includes('Big B')?.7:1,title:p[0]+' — '+p[1],icon:L.divIcon({className:'pin',html:icon,iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map).bindPopup(html,{maxWidth:250,autoPan:false});m.bindTooltip(p[0],{permanent:true,direction:'right',offset:[8,0],className:'place-label'});m.on('mouseover',()=>{if(matchMedia('(hover:hover)').matches){showHover(html);}});const o=document.createElement('option');o.value=i;o.textContent=p[0];document.querySelector('#place').append(o);return m;});
document.querySelector('#place').onchange=e=>{if(e.target.value==='')return;let i=+e.target.value;map.setView([places[i][2],places[i][3]],11);markers[i].openPopup()};document.querySelector('#all').onclick=()=>map.fitBounds([[35.7,-115.7],[40.25,-103.8]]);document.querySelector('#mountains').onclick=()=>{map.fitBounds([[38.7,-107.3],[39.5,-106.6]]);L.popup().setLatLng([39.03,-106.97]).setContent('<b>Elk Mountains</b><p>No direct ordinary road through the Maroon Bells wilderness. The usual summer road connection goes around via Carbondale, CO-133 and Kebler Pass. Backcountry 4WD routes require separate planning.</p><a href="https://aspenchamber.org/blog/aspen-crested-butte-hike-guide/" target="_blank">Route context ↗</a>').openOn(map)};
</script><script>
function labels(){markers.forEach((m,i)=>{const major=[0,1,4,5,7,9,10,12,13,14,15,16,17,18,19].includes(i);m.getTooltip().getElement()?.style.setProperty('display',map.getZoom()<7&&!major?'none':'');});}map.on('zoomend',labels);labels();
const params=new URLSearchParams(location.search),scope=params.get('scope')||'overview',choice=params.get('choice')||'compare';
const bounds={colorado:[[38.3,-107.85],[39.85,-105.85]],desert:[[36.45,-113.25],[39.2,-109.2]]};
if(bounds[scope])map.fitBounds(bounds[scope],{padding:[14,14]});
const names={bryce_spur:'Bryce add-on · 2–2½ h each way',page_bryce:'Page → Bryce · 3–3½ h',fire:'Optional Valley of Fire detour',hoover:'Optional Hoover Dam detour',redrock:'Optional Red Rock Canyon detour',sand:'Sand Flats road access',arrival:'Shared road legs',west:'Shared road legs',finish:'Shared road legs',both_exit:'Gunnison → Telluride',aspen:'Aspen option',cb:'Crested Butte option',both:'Both Colorado towns',north:'Via Capitol Reef / Escalante / Bryce',south:'Via Monument Valley / Page',grand:'Optional Grand Canyon North Rim',bells:'Maroon Bells road access',corona:'Corona Arch trailhead road access'},colors={bryce_spur:'#a27819',page_bryce:'#a27819',fire:'#527b85',hoover:'#527b85',redrock:'#527b85',sand:'#6d592c',arrival:'#6d592c',west:'#6d592c',finish:'#6d592c',both_exit:'#7544a3',aspen:'#246bb8',cb:'#aa3a81',both:'#7544a3',north:'#228156',south:'#d65a24',grand:'#8b654b',bells:'#246bb8',corona:'#6d592c'};
const legend=L.control({position:'bottomleft'});legend.onAdd=()=>{const d=L.DomUtil.create('div');d.id='route-legend';d.style.cssText='background:#fffef5;padding:6px 9px;max-width:220px;font:11px system-ui;border-radius:4px';d.innerHTML='Loading route outlines…';L.DomEvent.disableClickPropagation(d);return d};legend.addTo(map);
fetch('routes.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{
 let ids=scope==='colorado'?['aspen','cb','both','bells']:scope==='desert'?['north','south','grand','finish']:['arrival','west','finish','aspen','cb','north','south','grand','bells','corona'];
 if(scope==='overview'&&params.get('co')==='both')ids=['arrival','both','both_exit','west','north','south','grand','finish','bells','corona'];
 const selected=scope==='overview'?null:choice;if(scope==='overview')ids.push('fire','hoover','redrock','sand');if(params.get('bryce')==='1')ids.push('bryce_spur','page_bryce');let shown=[];
 ids.forEach(id=>{if(!data[id])return;let active=selected&&selected!=='compare'?id===selected:true;if(['arrival','west','finish','both_exit','bells','corona','grand','bryce_spur','page_bryce'].includes(id))active=true;if(scope==='overview'){const c=params.get('co')||'compare',d=params.get('desert')||'compare';active=['aspen','cb','both'].includes(id)?c==='compare'||c==='both'||c===id:['north','south'].includes(id)?d==='compare'||d===id:true;}
 const layer=L.geoJSON(data[id].geometry,{style:{color:colors[id],weight:active?4:2,opacity:active?.9:.2,dashArray:['both','grand','fire','hoover','redrock','bryce_spur','page_bryce'].includes(id)?'7 5':null}}).addTo(map).bindTooltip(names[id]);if(active&&!['west','finish','both_exit','bells','corona','sand','hoover','redrock'].includes(id))shown.push('<div><span style="color:'+colors[id]+'">━</span> '+(id==='fire'?'Optional Nevada detours':names[id])+'</div>');
 });document.querySelector('#route-legend').innerHTML=shown.join('')+'<div style="margin-top:4px">Road outlines · check seasonal access</div>';
}).catch(()=>document.querySelector('#route-legend').textContent='Route outlines unavailable; terrain and place markers still work.');
map.on('dragstart zoomstart',()=>document.getElementById('hover-preview')?.remove());
map.attributionControl.addAttribution('Routes: <a href="https://routing.openstreetmap.de/about.html">OSRM / FOSSGIS</a> · <a href="https://www.openstreetmap.org/fixthemap">Fix the map</a>');
</script></html>
