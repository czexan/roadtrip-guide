<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Terrain and places • design study</title><link rel="stylesheet" href="leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f5f1e7;color:#24382e}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap}button,select{font:inherit;padding:8px;border:1px solid #b8b7a9;border-radius:5px;background:white;min-height:38px}#map{height:calc(100vh - 102px);min-height:280px}.leaflet-control-layers-toggle{background-image:none!important;width:55px!important;display:grid;place-items:center}.leaflet-control-layers-toggle:after{content:"Layers"}.pin{border:2px solid white;border-radius:50%;background:#245e51;box-shadow:0 1px 5px #333;color:white;text-align:center;line-height:14px;font-size:12px}.leaflet-popup-content{width:220px!important;margin:12px}.preview img{width:100%;height:106px;object-fit:cover;border-radius:4px}.preview .missing{background:#eae5d9;padding:17px;text-align:center;color:#5d625c}.preview small{display:block;text-transform:uppercase;letter-spacing:.06em;margin:8px 0 4px}.preview h3{margin:0 0 6px;font-size:17px}.preview p{margin:5px 0;font-size:12px}.preview a{color:#255548}.foot{font-size:11px;margin:5px 10px}.leaflet-tooltip{font:12px system-ui;max-width:220px;white-space:normal}.leaflet-control-attribution{font-size:9px!important}#status{color:#a43f1b}.place-label{background:#fffef3e8;border:0;box-shadow:none;padding:1px 4px;font-weight:600;font-size:11px}.place-label:before{display:none}.leaflet-popup{z-index:999}
#hover-preview{position:absolute;right:12px;top:60px;width:244px;max-height:calc(100% - 85px);overflow:auto;background:white;border-radius:8px;padding:12px;z-index:1100;box-shadow:0 2px 14px #0003}#hover-preview>button{float:right;min-height:24px;padding:0 7px}#hover-preview .preview img{height:110px}

html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column}header{flex:none}header button,header select{min-height:44px}header select{flex:1;min-width:150px}#map{height:auto;min-height:220px;flex:1;position:relative}#legend-panel{flex:none;padding:8px 12px;background:#fffdf5;max-height:125px;overflow:auto;font-size:12px}#legend-panel summary{cursor:pointer;font-weight:600;min-height:28px}#route-legend{display:flex;gap:6px 16px;flex-wrap:wrap;padding-top:5px}.foot{flex:none}#hover-preview{top:10px;right:10px;width:min(290px,calc(100% - 65px));max-height:calc(100% - 20px);font-size:14px}#hover-preview>button{min-width:44px;min-height:44px}.preview p{font-size:14px}.preview a{display:inline-block;padding:7px 0}.preview img{max-height:100px}.pin{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #155db3;outline-offset:2px}
</style><div id="map" aria-label="Interactive terrain map"></div><details id="legend-panel" open><summary>Route colors · ★ Events</summary><div id="route-legend">Loading routes…</div></details><p class="foot">Tap a place marker for details. + / − to zoom. Markers locate places, not entrances. Terrain tiles need internet. <span id="status"></span></p><script src="leaflet.js"></script><script>
document.body.setAttribute('role','main');document.body.setAttribute('aria-label','Terrain map '+(new URLSearchParams(location.search).get('scope')||'overview'));
const places=[
['Denver International Airport','Airport',39.8561,-104.6737,'','Arrival only; continue west to the mountains.','https://www.flydenver.com/'],
['Breckenridge/Frisco area','Mountain towns and reservoir',39.5744,-106.0975,'frisco','Breckenridge, Frisco, Silverthorne and Dillon Reservoir form the first-stop area. Camp at Peak One Campground or check The Bivvi Hostel in Breckenridge.','https://www.townoffrisco.com/'],
['Peak One Campground','Campground',39.575,-106.07,'https://photos.thedyrt.com/photo/204180/media/peak-one_c40fb4c9961aad01e4b51b07b36fe064.heic?auto=webp','Camping on the Frisco Peninsula beside Dillon Reservoir. Distinct from Peak One mountain. Approximate campground location.','https://www.recreation.gov/search?q=Peak%20One%20Campground'],
['Breckenridge','Mountain town',39.4817,-106.0384,'breck','Historic town, cafes, hostel option and mountain access.','https://gobreck.com/'],
['Leadville','Historic mountain town',39.2508,-106.2925,'discovery-leadville-saloon','Optional saloon and town stop; no overnight required.','https://www.leadvilletwinlakes.com/'],
['Aspen','Mountain town',39.1911,-106.8175,'aspen-town','Downtown walks, Aspen Mountain gondola and access to Maroon Bells.','https://aspenchamber.org/'],
['Maroon Bells Scenic Area','Scenic lake and hiking area',39.0989,-106.9406,'mountains','Maroon Lake views and hiking, separate from Aspen town.','https://www.aspensnowmass.com/visit/activities/summer/maroon-bells'],
['Crested Butte','Mountain town',38.8697,-106.9878,'cb-fall','Elk Avenue, autumn walks and mountain biking. The Elk Mountains separate it from Aspen.','https://gunnisoncrestedbutte.com/'],
["Big B’s Delicious Orchards",'Optional lunch stop · cider garden',38.863,-107.62,'','Lunch, cider and a break if passing near Paonia; camping is secondary. Approximate area marker; use venue directions for arrival.','https://www.bigbs.com/camping'],
['Telluride','Mountain town',37.9375,-107.8123,'telluride','Box-canyon town, hiking and via ferrata option.','https://www.telluride.com/'],
['Moab','Desert town',38.5733,-109.5498,'moab-town','Base for riding, river camps, Arches and canyon walks.','https://www.discovermoab.com/'],
['Corona Arch Trail','Hiking trail',38.5748,-109.6328,'moab','Railway crossing and sandstone arch, off Potash Road. Marker locates the arch, not trailhead.','https://www.blm.gov/visit/corona-arch-trail'],
['Torrey / Capitol Reef','Town and national park gateway',38.2997,-111.4205,'reef','Northern route: sandstone cliffs, Hickman Bridge and scenic UT-24. A short stop is enough if continuing toward Escalante.','https://www.nps.gov/care/'],
['Escalante','Desert town',37.7703,-111.6021,'','Northern route gateway to canyon country and scenic Highway 12.','https://www.blm.gov/visit/grand-staircase-escalante-national-monument'],
['Bryce Canyon','National park',37.6283,-112.1677,'bryce','Northern route: hoodoo amphitheaters and rim walks.','https://www.nps.gov/brca/'],
['Monument Valley','Navajo Tribal Park',36.982,-110.112,'monument','Southern route: sandstone buttes and Navajo-guided experiences.','https://navajonationparks.org/tribal-parks/monument-valley/'],
['Page','Desert town',36.9147,-111.4558,'','Southern route: Antelope Canyon tours and Lake Powell area.','https://www.visitpageaz.com/'],
['Grand Canyon North Rim','National park viewpoint area',36.21,-112.058,'grand','Optional southern detour. Check current closures and services before choosing.','https://www.nps.gov/grca/northrimstatus.htm'],
['Zion Canyon','National park',37.2982,-113.0263,'zion','Canyon hikes, river walks and camping choices.','https://www.nps.gov/zion/'],
['Las Vegas','City · final stop',36.1699,-115.1398,'vegas','October 2–3: short city finish and departure.','https://www.visitlasvegas.com/'],
['Sand Flats campgrounds / Slickrock','Campgrounds and mountain biking',38.581,-109.499,'https://cgviewsmedia.blob.core.windows.net/images/2014/02/20140502_162345.jpg','Designated camping beside the Slickrock riding area. Individual campsites are first-come, first-served.','https://grandcountyutah.net/289/Camping'],
['Valley of Fire State Park','Optional scenic detour',36.4297,-114.5143,'discovery-valley-fire','Optional October 2 detour off the I-15 approach from Zion. Check entrance and trail alerts.','https://parks.nv.gov/parks/valley-of-fire'],
['Hoover Dam','Dam and engineering landmark',36.016,-114.7377,'discovery-hoover','Separate detour southeast of Las Vegas, not on the direct road from Zion.','https://www.usbr.gov/lc/hooverdam/service/directions.html'],
['Red Rock Canyon','National conservation area',36.135,-115.427,'','Optional outing west of Las Vegas. Scenic loop, hiking and climbing; check October timed-entry requirements.','https://www.blm.gov/visit/red-rock-canyon-national-conservation-area']];
const map=L.map('map',{scrollWheelZoom:true,zoomSnap:.25}).fitBounds([[35.7,-115.7],[40.25,-103.8]]);
const usgs=L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'<a href="https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer">USGS The National Map and contributors</a>'}).addTo(map);
L.control.scale({imperial:true}).addTo(map);
usgs.on('tileerror',()=>document.querySelector('#status').textContent='Some terrain tiles are unavailable. Try again when connected.');
function visitDate(i){const c=new URLSearchParams(location.search).get('co')||new URLSearchParams(location.search).get('choice');if(i===20)return 'Sep 24–26 Moab option';if(i>20)return 'Optional Oct 2; no extra overnight';if(i===0)return 'Sep 19 arrival';if([1,2,3].includes(i))return 'Sep 19 night';if(i===4)return 'Sep 20 passing stop';if([5,6].includes(i))return c==='cb'?'Not in Crested Butte-only choice':c==='both'?'Sep 20; depart Sep 21':'Sep 20–21 if choosing Aspen';if(i===7)return c==='aspen'?'Not in Aspen-only choice':c==='both'?'Sep 21; depart Sep 22':'Sep 20–21 if choosing Crested Butte';if(i===8)return 'Optional stop if passing';if(i===9)return 'Sep 22–23 nights; depart Sep 24';if([10,11].includes(i))return 'Sep 24–26 nights in Moab';if(i===14&&new URLSearchParams(location.search).get('bryce')==='1')return 'Optional Sep 30 day trip; or overnight Sep 28';if([12,13,14].includes(i))return 'Sep 27–28 northern route';if(i===15)return 'Sep 27 southern route';if(i===16)return 'One night Sep 27; Antelope tour Sep 28, then continue';if(i===17)return 'Optional Sep 28–29; reduces Zion time';if(i===18)return 'Sep 29–30 nights; Oct 1 flexible';return 'Oct 2 night; Oct 3 departure';}
function showHover(html){let box=document.getElementById('hover-preview');if(!box){box=document.createElement('aside');box.id='hover-preview';box.setAttribute('aria-label','Place details');box.setAttribute('role','region');document.getElementById('map').append(box);L.DomEvent.disableClickPropagation(box);L.DomEvent.disableScrollPropagation(box);}box.innerHTML='<button aria-label="Close place preview" onclick="this.parentElement.remove()">×</button>'+html;}
const markers=places.map((p,i)=>{let icon=p[1].includes('Campground')?'⌂':p[1].includes('trail')?'↟':p[1].includes('Airport')?'✈':'•';const html=`<div class="preview">${p[4]?`<img src="${p[4].startsWith('https://')?p[4]:'../assets/'+p[4]+'.jpg'}" alt="${p[0]}">`:''}<small>${p[1]}</small><h3>${p[0]}</h3><p><b>Tentative: ${visitDate(i)}</b></p><p>${p[5]}</p><a href="${p[6]}" target="_blank" rel="noopener">Place details ↗</a> · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p[0])}" target="_blank" rel="noopener">Google Maps ↗</a>${p[4]?'<p>Photo credit: <a href="../credits.html" target="_blank">guide credits</a> (<a href="index.html#photo-credits" target="_blank">additional gallery and town credits</a>)</p>':''}</div>`;const m=L.marker([p[2],p[3]],{opacity:p[0].includes('Big B')?.7:1,title:p[0]+' — '+p[1],icon:L.divIcon({className:'pin',html:icon,iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);m.bindTooltip(p[0],{permanent:true,direction:'right',offset:[8,0],className:'place-label'});m.on('click',()=>showHover(html));return m;});

</script><script>
function labels(){markers.forEach((m,i)=>{const major=[0,1,4,5,7,9,10,12,13,14,15,16,17,18,19].includes(i);m.getTooltip().getElement()?.style.setProperty('display',map.getZoom()<7&&!major?'none':'');});}map.on('zoomend',labels);labels();
const params=new URLSearchParams(location.search),scope=params.get('scope')||'overview',choice=params.get('choice')||'compare';
const bounds={colorado:[[38.3,-107.85],[39.85,-105.85]],desert:[[36.45,-113.25],[39.2,-109.2]]};
if(bounds[scope])map.fitBounds(bounds[scope],{padding:[14,14]});
const names={bryce_spur:'Bryce add-on · 2–2½ h each way',page_bryce:'Page → Bryce · 3–3½ h',fire:'Optional Valley of Fire detour',hoover:'Optional Hoover Dam detour',redrock:'Optional Red Rock Canyon detour',sand:'Sand Flats road access',arrival:'Shared road legs',west:'Shared road legs',finish:'Shared road legs',both_exit:'Gunnison → Telluride',aspen:'Aspen option',cb:'Crested Butte option',both:'Both Colorado towns',north:'Via Capitol Reef / Escalante / Bryce',south:'Via Monument Valley / Page',grand:'Optional Grand Canyon North Rim',bells:'Maroon Bells road access',corona:'Corona Arch trailhead road access'},colors={bryce_spur:'#a27819',page_bryce:'#a27819',fire:'#527b85',hoover:'#527b85',redrock:'#527b85',sand:'#6d592c',arrival:'#6d592c',west:'#6d592c',finish:'#6d592c',both_exit:'#7544a3',aspen:'#246bb8',cb:'#aa3a81',both:'#7544a3',north:'#228156',south:'#d65a24',grand:'#8b654b',bells:'#246bb8',corona:'#6d592c'};
fetch('routes.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{
 let ids=scope==='colorado'?['aspen','cb','both','bells']:scope==='desert'?['north','south','grand','finish']:['arrival','west','finish','aspen','cb','north','south','grand','bells','corona'];
 if(scope==='overview'&&params.get('co')==='both')ids=['arrival','both','both_exit','west','north','south','grand','finish','bells','corona'];
 const selected=scope==='overview'?null:choice;if(scope==='overview')ids.push('fire','hoover','redrock','sand');if(params.get('bryce')==='1')ids.push('bryce_spur','page_bryce');let shown=[];
 ids.forEach(id=>{if(!data[id])return;let active=selected&&selected!=='compare'?id===selected:true;if(['arrival','west','finish','both_exit','bells','corona','grand','bryce_spur','page_bryce'].includes(id))active=true;if(scope==='overview'){const c=params.get('co')||'compare',d=params.get('desert')||'compare';active=['aspen','cb','both'].includes(id)?c==='compare'||c==='both'||c===id:['north','south'].includes(id)?d==='compare'||d===id:true;}
 const layer=L.geoJSON(data[id].geometry,{style:{color:colors[id],weight:active?4:2,opacity:active?.9:.2,dashArray:['both','grand','fire','hoover','redrock','bryce_spur','page_bryce'].includes(id)?'7 5':null}}).addTo(map).bindTooltip(names[id]);if(active&&!['west','finish','both_exit','bells','corona','sand','hoover','redrock'].includes(id))shown.push('<div><span style="color:'+colors[id]+'">━</span> '+(id==='fire'?'Optional Nevada detours':names[id])+'</div>');
 });document.querySelector('#route-legend').innerHTML=shown.join('')+'<div style="margin-top:4px">Road outlines · check seasonal access</div>';
}).catch(()=>document.querySelector('#route-legend').textContent='Route outlines unavailable; terrain and place markers still work.');
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('hover-preview')?.remove()});
map.on('dragstart zoomstart',()=>document.getElementById('hover-preview')?.remove());
map.attributionControl.addAttribution('Routes: <a href="https://routing.openstreetmap.de/about.html">OSRM / FOSSGIS</a> · <a href="https://www.openstreetmap.org/fixthemap">Fix the map</a>');
</script></html>

<script>

eventPins.forEach(e=>{const m=L.marker([e[2],e[3]],{title:e[0],icon:L.divIcon({className:'event-pin',html:'★',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(map);m.getElement()?.setAttribute('aria-label',e[0]+' — '+e[1]);m.bindTooltip(e[0],{direction:'top'});m.on('click',()=>showHover(`<div class="preview"><small>Event option</small><h3>${e[0]}</h3><p><b>${e[1]}</b></p><p>Area marker. Use organizer directions for the venue; dates may require changing the itinerary.</p><a href="${e[4]}" target="_blank" rel="noopener">Organizer & directions ↗</a></div>`));});
</script><style>.event-pin{background:#8f3b66;color:white;border:2px solid white;border-radius:4px;text-align:center;line-height:20px;box-shadow:0 1px 4px #333}</style>
